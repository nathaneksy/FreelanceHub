# Free classroom demo: SQLite data can reset on restarts or redeploys.
# See docs/RENDER_DEPLOYMENT.md for the durable, paid disk option.
services:
  - type: web
    name: freelancehub
    runtime: node
    branch: bakeoff-1
    plan: free
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: SQLITE_PATH
        value: data/freelancehub.sqlite
